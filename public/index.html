<!DOCTYPE html>
<html>
<head>
    <title>Inventory Management</title>
</head>
<body>
    <h1>Inventory Management System</h1>

    <h3>Add/Update Item</h3>
    <form id="itemForm">
        <input type="number" id="itemId" placeholder="ID (e.g. 101)" required>
        <input type="text" id="itemName" placeholder="Name" required>
        <input type="number" id="itemQty" placeholder="Quantity" required>
        <input type="number" step="0.01" id="itemPrice" placeholder="Price" required>
        <button type="submit">Save Item</button>
    </form>

    <h3>Inventory List</h3>
    <button onclick="loadItems()">Refresh List</button>
    <ul id="itemList"></ul>

    <script>
        const form = document.getElementById('itemForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('itemId').value;
            const item = {
                id: parseInt(id),
                name: document.getElementById('itemName').value,
                quantity: parseInt(document.getElementById('itemQty').value),
                price: parseFloat(document.getElementById('itemPrice').value)
            };

            // Try to update first, if 404, we add
            let res = await fetch(`/api/items/${id}`, {
                method: 'PUT',
                body: JSON.stringify(item),
                headers: { 'Content-Type': 'application/json' }
            });

            if (res.status === 404) {
                res = await fetch('/api/items', {
                    method: 'POST',
                    body: JSON.stringify(item),
                    headers: { 'Content-Type': 'application/json' }
                });
            }

            if (res.ok) {
                alert("Saved successfully!");
                form.reset();
                loadItems();
            } else {
                const err = await res.json();
                alert("Error: " + err.error);
            }
        });

        async function deleteItem(id) {
            if (!confirm(`Delete item ${id}?`)) return;
            const res = await fetch(`/api/items/${id}`, { method: 'DELETE' });
            if (res.ok) {
                loadItems();
            } else {
                const err = await res.json();
                alert("Error: " + err.error);
            }
        }

        async function loadItems() {
            const res = await fetch('/api/items');
            const items = await res.json();
            const list = document.getElementById('itemList');
            list.innerHTML = '';
            for (const item of items) {
                const li = document.createElement('li');
                li.innerText = `[${item.id}] ${item.name} - Qty: ${item.quantity} - $${item.price} `;
                
                const delBtn = document.createElement('button');
                delBtn.innerText = 'Delete';
                delBtn.onclick = () => deleteItem(item.id);
                
                const editBtn = document.createElement('button');
                editBtn.innerText = 'Edit';
                editBtn.onclick = () => {
                    document.getElementById('itemId').value = item.id;
                    document.getElementById('itemName').value = item.name;
                    document.getElementById('itemQty').value = item.quantity;
                    document.getElementById('itemPrice').value = item.price;
                };

                li.appendChild(editBtn);
                li.appendChild(delBtn);
                list.appendChild(li);
            }
        }

        // Initial load
        loadItems();
    </script>
</body>
</html>
